name: 🐛 Bug Report
description: Report an issue or unexpected behavior in RiftPoint
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide a minimal, reproducible example or code snippet.
      placeholder: |
        1. Initialize RiftCheckpointSaver with ...
        2. Execute graph with ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Provide details about your environment (Python version, OS, riftpoint/janus version).
      placeholder: |
        - OS: macOS / Linux / Windows
        - Python version: 3.11.x
        - riftpoint version: 0.1.0
        - janus-tachyon-rs version: 0.2.1
    validations:
      required: true
