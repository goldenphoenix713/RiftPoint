# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.44.0
    hooks:
      - id: markdownlint
        args: [--fix]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      # Run the linter
      - id: ruff-check
        args: [--fix]
      # Run the formatter
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict typecheck)
        entry: uv run mypy src tests
        language: system
        types: [python]
        pass_filenames: false

  - repo: local
    hooks:
      - id: radon-metrics
        name: radon complexity & maintainability (Grade B or better)
        entry: uv run python scripts/check_radon.py src
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest
        name: pytest with coverage
        entry: uv run pytest
        language: system
        types: [python]
        pass_filenames: false
